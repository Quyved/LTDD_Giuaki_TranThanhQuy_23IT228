# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# Fix Kotlin Daemon crash on 8GB RAM machines:
# Run Kotlin compilation in the same JVM process as Gradle, avoiding spawning a second heavy JVM
kotlin.compiler.execution.strategy=in-process
